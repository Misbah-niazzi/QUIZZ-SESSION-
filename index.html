<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICT Test Quiz App</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f1f5f9;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 15px;
    }

    .app {
        width: 100%;
        max-width: 700px;
        background: white;
        border-radius: 18px;
        padding: 25px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }

    .header {
        text-align: center;
        margin-bottom: 25px;
    }

    .header h1 {
        font-size: 28px;
        margin-bottom: 8px;
    }

    .header p {
        color: #64748b;
    }

    .screen {
        display: none;
    }

    .screen.active {
        display: block;
    }

    .setup label {
        display: block;
        margin-top: 18px;
        margin-bottom: 8px;
        font-weight: bold;
    }

    select,
    button {
        width: 100%;
        padding: 13px;
        border-radius: 10px;
        border: 1px solid #cbd5e1;
        font-size: 16px;
    }

    button {
        background: #2563eb;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: bold;
        margin-top: 20px;
    }

    button:hover {
        opacity: 0.9;
    }

    .quiz-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
        gap: 10px;
    }

    .progress {
        color: #475569;
        font-weight: bold;
    }

    .timer {
        background: #fee2e2;
        color: #b91c1c;
        padding: 8px 12px;
        border-radius: 8px;
        font-weight: bold;
    }

    .question {
        font-size: 21px;
        font-weight: bold;
        margin: 25px 0;
        line-height: 1.5;
    }

    .option {
        width: 100%;
        text-align: left;
        background: #f8fafc;
        color: #0f172a;
        border: 2px solid #e2e8f0;
        margin: 8px 0;
        padding: 14px;
    }

    .option:hover {
        background: #e2e8f0;
    }

    .option.selected {
        border-color: #2563eb;
        background: #dbeafe;
    }

    .option.correct {
        background: #dcfce7;
        border-color: #16a34a;
    }

    .option.wrong {
        background: #fee2e2;
        border-color: #dc2626;
    }

    .navigation {
        display: flex;
        gap: 10px;
        margin-top: 20px;
    }

    .navigation button {
        margin-top: 0;
    }

    .prev {
        background: #64748b;
    }

    .result {
        text-align: center;
    }

    .score {
        font-size: 50px;
        font-weight: bold;
        margin: 20px 0;
    }

    .result p {
        font-size: 18px;
        margin: 8px;
    }

    .review {
        margin-top: 25px;
        text-align: left;
    }

    .review-item {
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        padding: 15px;
        margin: 10px 0;
    }

    .correct-text {
        color: #15803d;
        font-weight: bold;
    }

    .wrong-text {
        color: #dc2626;
        font-weight: bold;
    }

    @media (max-width: 500px) {
        .app {
            padding: 18px;
        }

        .header h1 {
            font-size: 23px;
        }

        .question {
            font-size: 18px;
        }

        .quiz-top {
            flex-direction: column;
            align-items: stretch;
        }
    }
</style>

<style>
#welcomePage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
}
.welcome-card{
  width:min(700px,92%);
  padding:55px 30px;
  border-radius:24px;
}
.welcome-card h1{
  font-size:42px;
  margin:0 0 18px;
}
.welcome-card p{
  font-size:25px;
  font-weight:700;
  margin:12px 0 30px;
}
.welcome-card button{
  font-size:20px;
  padding:14px 32px;
  cursor:pointer;
}
#quizSetup{display:none;}
</style>

</head>

<body>

<div class="app">

    <!-- HOME SCREEN -->
    <div id="homeScreen" class="screen active">

        <div class="header">
            <h1>QUIZZ SESSION </h1>
            
        </div>

        <div id="welcomePage">
  <div class="welcome-card">
    <h1>🎯 WELCOME TO THE QUIZ!</h1>
    <p>🍀 BEST OF LUCK!</p>
    <button onclick="openQuizSetup()">START QUIZ 🚀</button>
  </div>
</div>

<script>
function openQuizSetup(){
  document.getElementById("welcomePage").style.display="none";
  document.getElementById("quizSetup").style.display="block";
}
</script>

<div class="setup" id="quizSetup">

            <label>Select Portion</label>

            <select id="portionSelect">
                <option value="1">Portion 1 — 100 MCQs</option>
                <option value="2">Portion 2 — 100 MCQs</option>
                <option value="3">Portion 3 — 100 MCQs</option>
                <option value="4">Portion 4 — 100 MCQs</option>
                <option value="5">Portion 5 — 100 MCQs</option>
            </select>

            <label>Select Subject</label>

            <select id="subjectSelect">
                <option value="All">All Subjects</option>
                <option value="Pakistan Studies">Pakistan Studies</option>
                <option value="Islamiat">Islamiat</option>
                <option value="English">English</option>
                <option value="General Knowledge">General Knowledge</option>
                <option value="Computer">Computer</option>
                <option value="Math">Math</option>
            </select>

            <label>Number of Questions</label>

            <select id="questionCount">
                <option value="10">10 Questions</option>
                <option value="25">25 Questions</option>
                <option value="50">50 Questions</option>
                <option value="100" selected>100 Questions</option>
            </select>

            <label>Time</label>

            <select id="timeSelect">
                <option value="3600" selected>60 Minutes</option>
                <option value="600">10 Minutes</option>
                <option value="1200">20 Minutes</option>
                <option value="1800">30 Minutes</option>
            </select>

            <button onclick="startQuiz()">Start Quiz 🚀</button>

        </div>
    </div>


    <!-- QUIZ SCREEN -->
    <div id="quizScreen" class="screen">

        <div class="quiz-top">

            <div class="progress" id="progress">
                Question 1 / 100
            </div>

            <div class="timer" id="timer">
                60:00
            </div>

        </div>

        <div class="question" id="question">
            Question goes here
        </div>

        <div id="options"></div>

        <div class="navigation">

            <button class="prev" onclick="previousQuestion()">
                ← Previous
            </button>

            <button onclick="nextQuestion()">
                Next →
            </button>

        </div>

    </div>


    <!-- RESULT SCREEN -->
    <div id="resultScreen" class="screen">

        <div class="result">

            <div class="header">
                <h1>🎉 Quiz Completed!</h1>
            </div>

            <div class="score" id="score">
                0%
            </div>

            <p id="correctResult">Correct: 0</p>
            <p id="wrongResult">Wrong: 0</p>
            <p id="totalResult">Total: 0</p>
            <p id="totalScoreResult"><strong>Total Score: 0 / 100</strong></p>

            <button onclick="showHome()">
                🏠 Back to Home
            </button>

            <div class="review">
                <h2>Answer Review</h2>
                <div id="reviewList"></div>
            </div>

        </div>

    </div>

</div>

    {
        "subject": "Police & Law Basics",
        "question": "What should a police record primarily contain?",
        "options": [
            "Accurate relevant information",
            "Rumors",
            "Personal opinions only",
            "Unverified social media posts"
        ],
        "answer": 0,
        "portion": 5
    },
    {
        "subject": "Police & Law Basics",
        "question": "Which quality helps a public officer make fair decisions?",
        "options": [
            "Integrity",
            "Favoritism",
            "Bias",
            "Carelessness"
        ],
        "answer": 0,
        "portion": 5
    },
    {
        "subject": "Police & Law Basics",
        "question": "A professional complaint process should follow:",
        "options": [
            "Established law and procedure",
            "Personal preference",
            "Rumor",
            "Guesswork"
        ],
        "answer": 0,
        "portion": 5
    }
];


/* =========================
   VARIABLES
========================= */

let quizQuestions = [];
let currentQuestion = 0;
let userAnswers = [];
let timer;
let timeLeft = 0;


/* =========================
   START QUIZ
========================= */

function startQuiz() {

    const portion =
        parseInt(document.getElementById("portionSelect").value);

    const subject =
        document.getElementById("subjectSelect").value;

    const count =
        parseInt(document.getElementById("questionCount").value);

    timeLeft =
        parseInt(document.getElementById("timeSelect").value);


    /* Filter questions */

    quizQuestions = questions.filter(q =>
        q.portion === portion &&
        (subject === "All" || q.subject === subject)
    );


    /* Randomize questions */

    quizQuestions.sort(() => Math.random() - 0.5);


    /* Limit number */

    quizQuestions =
        quizQuestions.slice(
            0,
            Math.min(count, quizQuestions.length)
        );


    if (quizQuestions.length === 0) {

        alert("No questions available for this subject.");

        return;
    }


    userAnswers =
        new Array(quizQuestions.length).fill(null);

    currentQuestion = 0;


    showScreen("quizScreen");

    showQuestion();

    startTimer();
}


/* =========================
   SHOW QUESTION
========================= */

function showQuestion() {

    const q =
        quizQuestions[currentQuestion];


    document.getElementById("progress").innerText =
        `Question ${currentQuestion + 1} / ${quizQuestions.length}`;


    document.getElementById("question").innerText =
        q.question;


    const optionsDiv =
        document.getElementById("options");

    optionsDiv.innerHTML = "";


    q.options.forEach((option, index) => {

        const button =
            document.createElement("button");

        button.className = "option";

        button.innerText =
            `${String.fromCharCode(65 + index)}) ${option}`;


        if (userAnswers[currentQuestion] === index) {

            button.classList.add("selected");

        }


        button.onclick = function() {

            selectAnswer(index);

        };


        optionsDiv.appendChild(button);

    });

}


/* =========================
   SELECT ANSWER
========================= */

function selectAnswer(index) {

    userAnswers[currentQuestion] = index;

    showQuestion();

}


/* =========================
   NEXT QUESTION
========================= */

function nextQuestion() {

    if (currentQuestion <
        quizQuestions.length - 1) {

        currentQuestion++;

        showQuestion();

    } else {

        finishQuiz();

    }

}


/* =========================
   PREVIOUS QUESTION
========================= */

function previousQuestion() {

    if (currentQuestion > 0) {

        currentQuestion--;

        showQuestion();

    }

}


/* =========================
   TIMER
========================= */

function startTimer() {

    clearInterval(timer);

    updateTimer();


    timer = setInterval(() => {

        timeLeft--;

        updateTimer();


        if (timeLeft <= 0) {

            clearInterval(timer);

            alert("Time is over!");

            finishQuiz();

        }

    }, 1000);

}


function updateTimer() {

    const minutes =
        Math.floor(timeLeft / 60);

    const seconds =
        timeLeft % 60;


    document.getElementById("timer").innerText =

        `${String(minutes).padStart(2, "0")}:` +
        `${String(seconds).padStart(2, "0")}`;

}


/* =========================
   FINISH QUIZ
========================= */

function finishQuiz() {

    clearInterval(timer);


    let correct = 0;


    quizQuestions.forEach((q, index) => {

        if (userAnswers[index] === q.answer) {

            correct++;

        }

    });


    const wrong =
        quizQuestions.length - correct;


    const percentage =
        Math.round(
            (correct / quizQuestions.length) * 100
        );


    document.getElementById("score").innerText =
        `${percentage}%`;

    document.getElementById("correctResult").innerText =
        `Correct: ${correct}`;

    document.getElementById("wrongResult").innerText =
        `Wrong: ${wrong}`;

    document.getElementById("totalResult").innerText =
        `Total: ${quizQuestions.length}`;

    document.getElementById("totalScoreResult").innerText =
        `Total Score: ${correct} / ${quizQuestions.length}`;


    createReview();


    showScreen("resultScreen");

}


/* =========================
   ANSWER REVIEW
========================= */

function createReview() {

    const review =
        document.getElementById("reviewList");

    review.innerHTML = "";


    quizQuestions.forEach((q, index) => {

        const item =
            document.createElement("div");

        item.className =
            "review-item";


        const userAnswer =
            userAnswers[index];


        const isCorrect =
            userAnswer === q.answer;


        item.innerHTML = `

            <p>
                <strong>
                    ${index + 1}. ${q.question}
                </strong>
            </p>

            <br>

            <p>
                Your Answer:
                <span class="${
                    isCorrect
                    ? "correct-text"
                    : "wrong-text"
                }">

                    ${
                        userAnswer === null
                        ? "Not Answered"
                        : q.options[userAnswer]
                    }

                </span>
            </p>

            <p>
                Correct Answer:
                <span class="correct-text">
                    ${q.options[q.answer]}
                </span>
            </p>

        `;


        review.appendChild(item);

    });

}


/* =========================
   SCREEN CONTROL
========================= */

function showScreen(screenId) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {

            screen.classList.remove("active");

        });


    document
        .getElementById(screenId)
        .classList.add("active");

}


/* =========================
   HOME
========================= */

function showHome() {

    clearInterval(timer);

    showScreen("homeScreen");

}

</script>
